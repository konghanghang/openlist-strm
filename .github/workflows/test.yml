name: Test

on:
  push:
    branches:
      - master
      - main
      - develop
      - pre_release
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - master
      - main
      - develop
      - pre_release
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.github/workflows/test.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - 'Dockerfile'
              - '.github/workflows/test.yml'

  lint-backend:
    name: Lint Go Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build backend
        run: go build -v ./cmd/server

  test-web:
    name: Test Vue Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests if present
        run: npm test --if-present

      - name: Build frontend
        run: npm run build
